name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional: add these repo secrets for a stable signing key across builds.
      # Without them each build is signed with a fresh throwaway key (never stored).
      KEYSTORE_B64: ${{ secrets.YMUSIC_KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.YMUSIC_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform project
        run: flutter create --platforms=android --org tech.varsen --project-name ymusic .

      - name: Get packages
        run: flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Apply Android overrides
        run: python3 tool/patch_android.py

      - name: Signing keystore
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/ymusic-release.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASS"
            echo "Using keystore from repository secrets"
          else
            PASS=$(openssl rand -hex 24)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -alias ymusic -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Varsen, OU=ymusic, O=Varsen, L=Chiva, C=ES"
            echo "Generated a throwaway release keystore for this build"
          fi
          {
            echo "storePassword=$PASS"
            echo "keyPassword=$PASS"
            echo "keyAlias=ymusic"
            echo "storeFile=$KS"
          } > android/key.properties

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify signature
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ymusic.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs ymusic.apk | head -5
          ls -l ymusic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ymusic-apk
          path: ymusic.apk
          if-no-files-found: error
