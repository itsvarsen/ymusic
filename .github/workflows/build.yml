name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_PASS: ymusic-varsen-2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform project
        run: flutter create --platforms=android --org tech.varsen --project-name ymusic .

      - name: Get packages
        run: flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Apply Android overrides
        run: python3 tool/patch_android.py

      - name: Signing keystore
        run: |
          mkdir -p signing
          if [ ! -f signing/ymusic-release.jks ]; then
            keytool -genkeypair -v -keystore signing/ymusic-release.jks -storetype PKCS12 \
              -alias ymusic -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Varsen, OU=ymusic, O=Varsen, L=Chiva, C=ES"
            echo "KEYSTORE_GENERATED=1" >> "$GITHUB_ENV"
          fi
          {
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KS_PASS"
            echo "keyAlias=ymusic"
            echo "storeFile=$GITHUB_WORKSPACE/signing/ymusic-release.jks"
          } > android/key.properties

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify signature
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ymusic.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs ymusic.apk | head -5
          ls -l ymusic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ymusic-apk
          path: ymusic.apk
          if-no-files-found: error

      - name: Upload generated keystore (first run only)
        if: env.KEYSTORE_GENERATED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: signing/ymusic-release.jks
