name: ymusic
description: "⅄music — a warm, glassy player for the music you own."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.2
  file_picker: ^13.2.0
  audio_metadata_reader: ^1.8.1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  provider: ^6.1.5
  permission_handler: ">=11.4.0 <14.0.0"
  google_fonts: ">=6.2.1 <10.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0E0B09"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
